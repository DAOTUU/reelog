<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover 是 iOS 安全区 env(safe-area-inset-*) 生效的前提 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- iOS 添加到主屏幕后隐藏 Safari 外壳。
         apple-mobile-web-app-capable 虽是 legacy，但 iOS 仍读它，
         与 manifest 的 display:standalone 构成双保险。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Reelog" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <!-- 状态栏 / 桌面端标题栏配色。必须浅色深色分开给：
         manifest 里的 theme_color 不支持 media query，拿不到系统主题，
         写死一个值就必然在另一半场景下出错。 -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0b0b0f"
    />
    <meta name="description" content="记录在影院看过的电影" />

    <title>Reelog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
