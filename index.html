<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover 是 iOS 安全区 env(safe-area-inset-*) 生效的前提 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- iOS 添加到主屏幕后隐藏 Safari 外壳。
         apple-mobile-web-app-capable 虽是 legacy，但 iOS 仍读它，
         与 manifest 的 display:standalone 构成双保险。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Reelog" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="记录在影院看过的电影" />

    <title>Reelog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
